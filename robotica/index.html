ones en orden, de arriba abajo.": {"en": "<b>Sequence:</b> the computer runs the instructions in order, from top to bottom."}, "La esquina": {"en": "The corner"}, "Ahora hay que girar. Ojo: el robot gira según hacia dónde mira <b>él</b>, no tú.": {"en": "Now you have to turn. Careful: the robot turns according to where <b>it</b> is facing, not you."}, "<b>Orientación:</b> ponte en el lugar del robot. ¿Su izquierda es tu izquierda?": {"en": "<b>Orientation:</b> put yourself in the robot’s place. Is its left your left?"}, "El pasillo largo": {"en": "The long corridor"}, "Solo puedes usar <b>2 bloques</b>. ¿Cómo avanzas 6 casillas?": {"en": "You can only use <b>2 blocks</b>. How do you move 6 squares?"}, "<b>Bucle:</b> «Repetir» hace lo mismo muchas veces sin tener que escribirlo muchas veces.": {"en": "<b>Loop:</b> «Repeat» does the same thing many times without you writing it many times."}, "La escalera": {"en": "The staircase"}, "Sube la escalera con <b>5 bloques</b> como máximo. Busca el trozo que se repite.": {"en": "Climb the stairs with at most <b>5 blocks</b>. Look for the part that repeats."}, "<b>Patrones:</b> los programadores buscan lo que se repite para escribir menos código.": {"en": "<b>Patterns:</b> programmers look for what repeats so they can write less code."}, "Cazaestrellas": {"en": "Star hunter"}, "Recoge las 3 estrellas ⭐ y vuelve a la bandera. Máximo <b>4 bloques</b>: ¡un bucle dentro de otro!": {"en": "Collect the 3 stars ⭐ and return to the flag. Maximum <b>4 blocks</b>: a loop inside a loop!"}, "<b>Bucles anidados:</b> un cuadrado = 4 × (lado + giro), y cada lado = 4 × avanzar.": {"en": "<b>Nested loops:</b> a square = 4 × (side + turn), and each side = 4 × move forward."}, "Caza el bug 🐛": {"en": "Bug hunt 🐛"}, "Otro programador escribió este programa, pero tiene <b>2 errores</b>. Ejecútalo, mira dónde falla y arréglalo.": {"en": "Another programmer wrote this program, but it has <b>2 mistakes</b>. Run it, see where it fails and fix it."}, "<b>Depurar (debugging):</b> encontrar y corregir errores es la mitad del trabajo de un programador.": {"en": "<b>Debugging:</b> finding and fixing mistakes is half of a programmer’s job."}, "El robot aspirador": {"en": "The robot vacuum"}, "El laberinto es muy largo, pero solo tienes <b>4 bloques</b>. Usa el sensor: si hay pared delante, gira a la derecha; después, avanza.": {"en": "The maze is very long, but you only have <b>4 blocks</b>. Use the sensor: if there is a wall ahead, turn right; then move forward."}, "<b>Sensores y condiciones:</b> así deciden los robots de verdad, como un robot aspirador o un coche autónomo.": {"en": "<b>Sensors and conditions:</b> this is how real robots decide, like a robot vacuum or a self-driving car."}, "Pasillos misteriosos 🎲": {"en": "Mystery corridors 🎲"}, "Los pasillos cambian de longitud en cada mapa: <b>no puedes contar los pasos</b>. Usa «Mientras haya camino delante → avanzar». Tu programa se probará en <b>3 mapas distintos</b>. Máximo 7 bloques.": {"en": "The corridors change length on every map: <b>you can’t count the steps</b>. Use «While there is a path ahead → move forward». Your program will be tested on <b>3 different maps</b>. Maximum 7 blocks."}, "<b>Bucle «mientras» (while):</b> repite algo mientras se cumpla una condición, sin saber de antemano cuántas veces.": {"en": "<b>«While» loop:</b> repeats something as long as a condition is true, without knowing in advance how many times."}, "La serpiente 🎲": {"en": "The snake 🎲"}, "Un camino que gira sin parar y es distinto en cada mapa. Crea una regla que funcione siempre: si hay camino delante, avanza; si no, gira hacia el lado donde haya camino. Se probará en <b>3 mapas</b>. Máximo 6 bloques.": {"en": "A path that keeps turning and is different on every map. Create a rule that always works: if there is a path ahead, move forward; otherwise, turn towards the side with a path. It will be tested on <b>3 maps</b>. Maximum 6 blocks."}, "<b>Condición «si… si no» (if-else):</b> el programa elige entre dos caminos. ¡Puedes meter un «si» dentro de otro!": {"en": "<b>«If… else» condition:</b> the program chooses between two paths. You can put one «if» inside another!"}, "El laberinto 🎲": {"en": "The maze 🎲"}, "Un laberinto de verdad, con caminos sin salida. Truco de exploradores: <b>sigue siempre la pared de tu derecha</b> (si hay camino a la derecha, gira y avanza; si no…). Se probará en <b>3 laberintos</b>. Máximo 7 bloques.": {"en": "A real maze, with dead ends. Explorer’s trick: <b>always follow the wall on your right</b> (if there is a path on the right, turn and move forward; otherwise…). It will be tested on <b>3 mazes</b>. Maximum 7 blocks."}, "<b>Algoritmo general:</b> una regla bien pensada resuelve cualquier laberinto sin conocerlo de antes.": {"en": "<b>General algorithm:</b> one well-designed rule solves any maze without knowing it beforehand."}, "Explorador total 🎲": {"en": "Total explorer 🎲"}, "Hay 3 estrellas escondidas en caminos sin salida. Recógelas <b>todas</b> y vuelve a la base 🏁 (donde empiezas). Se probará en <b>3 laberintos</b>. Máximo 15 bloques.": {"en": "There are 3 stars hidden in dead ends. Collect <b>all</b> of them and return to base 🏁 (where you start). It will be tested on <b>3 mazes</b>. Maximum 15 blocks."}, "<b>Programas por fases:</b> primero una tarea y después otra. Los programas grandes se construyen juntando partes pequeñas.": {"en": "<b>Programs in phases:</b> first one task, then another. Big programs are built by joining small parts."}, "A oscuras 🌑🎲": {"en": "In the dark 🌑🎲"}, "Laberinto gigante y ¡sin luz! Solo ves lo que detectan los sensores del robot. Se probará en <b>3 laberintos</b>. Máximo 7 bloques.": {"en": "A giant maze with no light! You only see what the robot’s sensors detect. It will be tested on <b>3 mazes</b>. Maximum 7 blocks."}, "<b>Robots autónomos:</b> un robot real nunca ve el mapa entero; decide solo con lo que le dicen sus sensores.": {"en": "<b>Autonomous robots:</b> a real robot never sees the whole map; it decides only with what its sensors tell it."}, "pasos": {"en": "steps"}, "↺ Girar izquierda 90°": {"en": "↺ Turn left 90°"}, "↻ Girar derecha 90°": {"en": "↻ Turn right 90°"}, "↺ Girar izquierda 45°": {"en": "↺ Turn left 45°"}, "↻ Girar derecha 45°": {"en": "↻ Turn right 45°"}, "✋ Subir lápiz": {"en": "✋ Pen up"}, "✏️ Bajar lápiz": {"en": "✏️ Pen down"}, "🎨 Color": {"en": "🎨 Colour"}, "⚫ negro": {"en": "⚫ black"}, "🔴 rojo": {"en": "🔴 red"}, "🔵 azul": {"en": "🔵 blue"}, "🟢 verde": {"en": "🟢 green"}, "🟠 naranja": {"en": "🟠 orange"}, "🟣 morado": {"en": "🟣 purple"}, "Objetivo": {"en": "Target"}, "✏️ Tu dibujo": {"en": "✏️ Your drawing"}, "✏️ ¡El lápiz se sale del papel! Revisa el número de pasos o la dirección.": {"en": "✏️ The pencil goes off the paper! Check the number of steps or the direction."}, "🎨 ¡Dibujo terminado! Pulsa «Reiniciar» para borrarlo o cambia el programa para mejorarlo.": {"en": "🎨 Drawing finished! Press «Reset» to clear it, or change the program to improve it."}, "✏️ ¡Has dibujado de más! Hay líneas que no están en el objetivo.": {"en": "✏️ You drew too much! Some lines are not part of the target."}, "✏️ ¡Vas bien, pero te falta una parte del dibujo!": {"en": "✏️ Good so far, but part of the drawing is missing!"}, "✏️ El dibujo no coincide con el objetivo. Usa «Paso a paso» para ver dónde se desvía el lápiz.": {"en": "✏️ The drawing doesn’t match the target. Use «Step by step» to see where the pencil goes wrong."}, "lápiz": {"en": "pencil"}, "✏️ abajo": {"en": "✏️ down"}, "✋ arriba": {"en": "✋ up"}, "color": {"en": "colour"}, "Una línea recta": {"en": "A straight line"}, "Dibuja la línea punteada. Cambia el número de pasos del bloque para que llegue justo al final.": {"en": "Draw the dotted line. Change the number of steps in the block so it reaches exactly the end."}, "<b>Parámetros:</b> muchos bloques tienen un valor que puedes cambiar, como el número de pasos.": {"en": "<b>Parameters:</b> many blocks have a value you can change, like the number of steps."}, "El cuadrado": {"en": "The square"}, "Dibuja el cuadrado con <b>3 bloques</b> como máximo.": {"en": "Draw the square with at most <b>3 blocks</b>."}, "<b>Bucle:</b> un cuadrado son 4 lados iguales y 4 giros iguales. ¡Repítelo!": {"en": "<b>Loop:</b> a square is 4 equal sides and 4 equal turns. Repeat it!"}, "Dibuja la escalera con <b>5 bloques</b> como máximo. El lápiz empieza mirando hacia arriba.": {"en": "Draw the staircase with at most <b>5 blocks</b>. The pencil starts facing up."}, "<b>Patrones:</b> busca el trozo que se repite: subir, girar, avanzar, girar…": {"en": "<b>Patterns:</b> look for the part that repeats: up, turn, forward, turn…"}, "Las almenas del castillo": {"en": "The castle battlements"}, "Dibuja las almenas del castillo 🏰 con un bucle. Máximo <b>9 bloques</b>.": {"en": "Draw the castle battlements 🏰 with a loop. Maximum <b>9 blocks</b>."}, "<b>Descomponer:</b> divide el dibujo en trozos iguales y programa solo uno.": {"en": "<b>Decomposition:</b> split the drawing into equal pieces and program just one."}, "Dos ventanas": {"en": "Two windows"}, "Dibuja los dos cuadrados <b>sin unirlos</b>. Pista: con el lápiz subido, el lápiz se mueve sin pintar.": {"en": "Draw the two squares <b>without joining them</b>. Hint: with the pen up, the pencil moves without drawing."}, "<b>Estados:</b> el ordenador recuerda si el lápiz está subido o bajado y actúa según eso.": {"en": "<b>States:</b> the computer remembers whether the pen is up or down and acts accordingly."}, "Dibujo libre 🎨": {"en": "Free drawing 🎨"}, "¡Sin objetivo! Usa colores y giros de 45° para crear lo que quieras: tu inicial, una casa, un cohete, un diamante…": {"en": "No target! Use colours and 45° turns to create whatever you like: your initial, a house, a rocket, a diamond…"}, "<b>Creatividad:</b> programar también sirve para crear arte. Enseñad vuestro dibujo a otra pareja.": {"en": "<b>Creativity:</b> coding can also be used to make art. Show your drawing to another pair."}, "💡 Encender": {"en": "💡 Switch on"}, "⚫ Apagar": {"en": "⚫ Switch off"}, "⏳ Esperar": {"en": "⏳ Wait"}, "segundos": {"en": "seconds"}, "👆 Esperar hasta que pulsen el botón": {"en": "👆 Wait until the button is pressed"}, "🟠 ámbar": {"en": "🟠 amber"}, "PULSAR": {"en": "PRESS"}, "🎯 Objetivo": {"en": "🎯 Target"}, "💡 Tu programa": {"en": "💡 Your program"}, "apagado": {"en": "off"}, "👆 botón": {"en": "👆 button"}, "fin": {"en": "end"}, "👆 El programa está esperando… ¡Pulsa el botón del peatón!": {"en": "👆 The program is waiting… Press the pedestrian button!"}, "🚦 ¡Cuidado! Hay dos luces encendidas a la vez. ¿Te has olvidado de apagar alguna?": {"en": "🚦 Careful! Two lights are on at the same time. Did you forget to switch one off?"}, "🚦 La secuencia no coincide con el objetivo. Compara las dos líneas de tiempo: el recuadro rojo marca dónde empieza la diferencia.": {"en": "🚦 The sequence doesn’t match the target. Compare the two timelines: the red box shows where the difference starts."}, "tiempo": {"en": "time"}, "esperando": {"en": "waiting"}, "ON": {"en": "ON"}, "off": {"en": "off"}, "¡Luz roja!": {"en": "Red light!"}, "Enciende el LED rojo del semáforo.": {"en": "Switch on the red LED of the traffic light."}, "<b>Salida:</b> un LED es un dispositivo de salida. El programa le dice cuándo encenderse.": {"en": "<b>Output:</b> an LED is an output device. The program tells it when to switch on."}, "Parpadeo": {"en": "Blinking"}, "Haz que la luz roja parpadee 3 veces: 1 segundo encendida, 1 segundo apagada. Al final debe quedar apagada. Máximo <b>5 bloques</b>.": {"en": "Make the red light blink 3 times: 1 second on, 1 second off. At the end it must stay off. Maximum <b>5 blocks</b>."}, "<b>Tiempo:</b> sin «Esperar», el ordenador va tan rápido que no verías el parpadeo.": {"en": "<b>Time:</b> without «Wait», the computer is so fast you wouldn’t see the blinking."}, "El semáforo": {"en": "The traffic light"}, "Programa un ciclo de semáforo: <b>verde 3 s → ámbar 1 s → rojo 3 s</b>, y al final todo apagado. ¡Solo puede haber una luz encendida cada vez!": {"en": "Program one traffic-light cycle: <b>green 3 s → amber 1 s → red 3 s</b>, and everything off at the end. Only one light can be on at a time!"}, "<b>Algoritmo:</b> una lista ordenada de pasos para resolver un problema real.": {"en": "<b>Algorithm:</b> an ordered list of steps to solve a real problem."}, "Semáforo que no para": {"en": "Non-stop traffic light"}, "Ahora el ciclo verde → ámbar → rojo tiene que repetirse <b>3 veces</b>. Máximo <b>10 bloques</b>.": {"en": "Now the green → amber → red cycle has to repeat <b>3 times</b>. Maximum <b>10 blocks</b>."}, "<b>Bucle:</b> los semáforos reales repiten el mismo programa todo el día.": {"en": "<b>Loop:</b> real traffic lights repeat the same program all day long."}, "Botón de peatones 🚶": {"en": "Pedestrian button 🚶"}, "El semáforo está en <b>verde</b> hasta que un peatón pulsa el botón. Entonces: <b>ámbar 1 s → rojo 3 s → verde</b> otra vez.": {"en": "The light stays <b>green</b> until a pedestrian presses the button. Then: <b>amber 1 s → red 3 s → green</b> again."}, "<b>Entrada:</b> el botón es un sensor. El programa espera a que pase algo en el mundo real.": {"en": "<b>Input:</b> the button is a sensor. The program waits for something to happen in the real world."}, "🧩 Algoritmos": {"en": "🧩 Algorithms"}, "Algoritmos": {"en": "Algorithms"}, "⭐ Empieza aquí": {"en": "⭐ Start here"}, "Empieza aquí": {"en": "Start here"}, "Descubre qué es un algoritmo y mira cómo lo ejecuta un ordenador por dentro.": {"en": "Discover what an algorithm is and see how a computer runs it on the inside."}, "Orden": {"en": "Order"}, "Precisión": {"en": "Precision"}, "Procesador": {"en": "Processor"}, "¿Qué es un algoritmo?": {"en": "What is an algorithm?"}, "Un algoritmo es una lista de pasos {a}, {b} y {c} para resolver un problema.": {"en": "An algorithm is a list of {a}, {b} and {c} steps to solve a problem."}, "ordenados": {"en": "ordered"}, "precisos": {"en": "precise"}, "finitos": {"en": "finite"}, "Completa los ejercicios para descubrir las palabras que faltan.": {"en": "Complete the exercises to reveal the missing words."}, "1 · Ordena los pasos": {"en": "1 · Put the steps in order"}, "2 · ¿Lo entendería un ordenador?": {"en": "2 · Would a computer understand it?"}, "3 · Sé el ordenador": {"en": "3 · Be the computer"}, "4 · Dentro del ordenador": {"en": "4 · Inside the computer"}, "Ordena los pasos": {"en": "Put the steps in order"}, "Elige una tarea. Pulsa los pasos en el orden correcto para construir el algoritmo.": {"en": "Choose a task. Click the steps in the right order to build the algorithm."}, "Pasos desordenados:": {"en": "Mixed-up steps:"}, "¡Todos colocados! Pulsa «Comprobar».": {"en": "All placed! Click «Check»."}, "Tu algoritmo:": {"en": "Your algorithm:"}, "✔ Comprobar": {"en": "✔ Check"}, "🔀 Mezclar otra vez": {"en": "🔀 Shuffle again"}, "Te faltan pasos por colocar.": {"en": "You still have steps to place."}, "El paso {n} no está en su sitio. Si el orden cambia, el resultado cambia.": {"en": "Step {n} is in the wrong place. If the order changes, the result changes."}, "Ejecutando el algoritmo paso a paso…": {"en": "Running the algorithm step by step…"}, "¡Algoritmo correcto! Has puesto los pasos en orden: eso es lo primero que necesita un algoritmo.": {"en": "Correct algorithm! You put the steps in order: that is the first thing an algorithm needs."}, "Lavarse los dientes": {"en": "Brushing your teeth"}, "Coger el cepillo": {"en": "Pick up the toothbrush"}, "Poner pasta en el cepillo": {"en": "Put toothpaste on the brush"}, "Cepillar los dientes 2 minutos": {"en": "Brush your teeth for 2 minutes"}, "Enjuagarse la boca": {"en": "Rinse your mouth"}, "Guardar el cepillo": {"en": "Put the toothbrush away"}, "Cruzar la calle": {"en": "Crossing the street"}, "Llegar al paso de peatones": {"en": "Arrive at the pedestrian crossing"}, "Pararse en el bordillo": {"en": "Stop at the kerb"}, "Pulsar el botón": {"en": "Press the button"}, "Esperar a que el muñeco se ponga verde": {"en": "Wait for the green man"}, "Cruzar caminando": {"en": "Walk across"}, "Plantar una semilla": {"en": "Planting a seed"}, "Llenar la maceta de tierra": {"en": "Fill the pot with soil"}, "Hacer un agujero con el dedo": {"en": "Make a hole with your finger"}, "Meter la semilla en el agujero": {"en": "Put the seed in the hole"}, "Tapar la semilla con tierra": {"en": "Cover the seed with soil"}, "Regar": {"en": "Water it"}, "Hacer un bocadillo": {"en": "Making a sandwich"}, "Coger una barra de pan": {"en": "Take a bread roll"}, "Abrir el pan por la mitad": {"en": "Cut the bread in half"}, "Poner el jamón dentro": {"en": "Put the ham inside"}, "Cerrar el pan": {"en": "Close the bread"}, "¡Comer!": {"en": "Eat!"}, "¿Lo entendería un ordenador?": {"en": "Would a computer understand it?"}, "Un ordenador no adivina nada. Marca las instrucciones que un ordenador <b>NO</b> podría seguir.": {"en": "A computer can’t guess anything. Mark the instructions a computer could <b>NOT</b> follow."}, "Dibujar una casa": {"en": "Drawing a house"}, "Dibuja un cuadrado de 4 cm de lado.": {"en": "Draw a square with 4 cm sides."}, "Pon encima un tejado bonito.": {"en": "Put a nice roof on top."}, "Dibuja una puerta de 1 cm de ancho y 2 cm de alto en el centro del lado de abajo.": {"en": "Draw a door 1 cm wide and 2 cm high in the middle of the bottom side."}, "Añade algunas ventanas.": {"en": "Add some windows."}, "Pinta la puerta de color marrón.": {"en": "Colour the door brown."}, "Sigue dibujando hasta que te parezca que está bien.": {"en": "Keep drawing until you think it looks good."}, "¿Qué es «bonito»? El ordenador no tiene gustos: necesita formas y medidas exactas.": {"en": "What is «nice»? A computer has no taste: it needs exact shapes and measurements."}, "¿Cuántas son «algunas»? ¿Dónde? Hay que decir el número y la posición.": {"en": "How many is «some»? Where? You need to give the number and the position."}, "¿Cuándo termina? Un algoritmo debe ser finito: tiene que acabar en un momento claro.": {"en": "When does it end? An algorithm must be finite: it has to stop at a clear moment."}, "Hacer zumo de naranja": {"en": "Making orange juice"}, "Coge 3 naranjas.": {"en": "Take 3 oranges."}, "Corta cada naranja por la mitad.": {"en": "Cut each orange in half."}, "Exprímelas un rato.": {"en": "Squeeze them for a while."}, "Echa el zumo en un vaso.": {"en": "Pour the juice into a glass."}, "Añade azúcar al gusto.": {"en": "Add sugar to taste."}, "Repite para siempre: remueve el zumo.": {"en": "Repeat forever: stir the juice."}, "¿Cuánto es «un rato»? Mejor: «exprime cada mitad hasta que no salga más zumo».": {"en": "How long is «a while»? Better: «squeeze each half until no more juice comes out»."}, "¿Al gusto de quién? Hay que dar una cantidad exacta, por ejemplo «1 cucharadita».": {"en": "To whose taste? You need an exact amount, for example «1 teaspoon»."}, "¡Nunca termina! Un algoritmo tiene que acabar.": {"en": "It never ends! An algorithm has to finish."}, "¡Esta tampoco la entendería!": {"en": "It wouldn’t understand this one either!"}, "Esta sí es precisa: el ordenador sabría hacerla.": {"en": "This one is precise: the computer could do it."}, "Dame instrucciones exactas y las cumpliré sin equivocarme.": {"en": "Give me exact instructions and I’ll follow them without mistakes."}, "¡Perfecto! Ya sabes qué instrucciones son <b>precisas</b> y cuáles hacen que un algoritmo no sea <b>finito</b>.": {"en": "Perfect! Now you know which instructions are <b>precise</b> and which ones make an algorithm not <b>finite</b>."}, "¡Error de sistema! Revisa las instrucciones marcadas en rojo.": {"en": "System error! Check the instructions marked in red."}, "Sé el ordenador": {"en": "Be the computer"}, "Ahora tú eres el procesador: sigue el algoritmo <b>exactamente</b> y pinta las casillas. ¿Qué dibujo aparece?": {"en": "Now you are the processor: follow the algorithm <b>exactly</b> and colour the squares. What picture appears?"}, "Dibujo {n}": {"en": "Picture {n}"}, "Tú": {"en": "You"}, "Algoritmo:": {"en": "Algorithm:"}, "Fila {r}: pinta {c}": {"en": "Row {r}: colour {c}"}, "🧽 Borrar": {"en": "🧽 Clear"}, "⚡ Que lo haga el ordenador": {"en": "⚡ Let the computer do it"}, "❤️ ¡Es un corazón!": {"en": "❤️ It’s a heart!"}, "😊 ¡Es una carita sonriente!": {"en": "😊 It’s a smiley face!"}, "🏠 ¡Es una casa!": {"en": "🏠 It’s a house!"}, "Hay {w} casillas pintadas de más y {m} sin pintar. ¡Un ordenador no se equivoca nunca al seguir el algoritmo!": {"en": "There are {w} squares coloured by mistake and {m} missing. A computer never makes mistakes when following the algorithm!"}, "Este ordenador va despacio para que puedas verlo. Uno de verdad lo haría en menos de una millonésima de segundo, y nunca se equivoca… si el algoritmo está bien.": {"en": "This computer goes slowly so you can watch. A real one would do it in less than a millionth of a second, and it never makes mistakes… if the algorithm is right."}, "Dentro del ordenador: así se ejecuta un algoritmo": {"en": "Inside the computer: this is how an algorithm runs"}, "El programa está guardado en la memoria. El procesador repite siempre el mismo ciclo: <b>buscar → descodificar → ejecutar</b>. Mira cómo prepara un bocadillo.": {"en": "The program is stored in memory. The processor always repeats the same cycle: <b>fetch → decode → execute</b>. Watch it make a sandwich."}, "Memoria (RAM)": {"en": "Memory (RAM)"}, "Número de tomates:": {"en": "Number of tomatoes:"}, "Último ingrediente:": {"en": "Last ingredient:"}, "✔ Quitar el bug": {"en": "✔ Remove the bug"}, "🐛 Meter un bug en el programa": {"en": "🐛 Put a bug in the program"}, "Procesador (CPU)": {"en": "Processor (CPU)"}, "BUSCAR": {"en": "FETCH"}, "DESCODIFICAR": {"en": "DECODE"}, "EJECUTAR": {"en": "EXECUTE"}, "Contador de programa (PC)": {"en": "Program counter (PC)"}, "Ciclo nº": {"en": "Cycle no."}, "Registro de instrucción (IR)": {"en": "Instruction register (IR)"}, "Unidad de control: ¿qué significa?": {"en": "Control unit: what does it mean?"}, "ALU (calculadora)": {"en": "ALU (calculator)"}, "Registro «contador»": {"en": "«counter» register"}, "Salida: robot cocinero": {"en": "Output: robot chef"}, "Pulsa «▶ Ejecutar» o «⏭ Siguiente fase» para que el procesador empiece.": {"en": "Click «▶ Run» or «⏭ Next phase» to start the processor."}, "⏭ Siguiente fase": {"en": "⏭ Next phase"}, "Un procesador real hace este ciclo unos 3.000 millones de veces por segundo (3 GHz).": {"en": "A real processor does this cycle about 3 billion times per second (3 GHz)."}, "COGER {x}": {"en": "TAKE {x}"}, "PONER {x}": {"en": "ADD {x}"}, "TAPAR con pan": {"en": "CLOSE with bread"}, "contador = 0": {"en": "counter = 0"}, "contador = contador + 1": {"en": "counter = counter + 1"}, "SI contador < {n} → IR A {a}": {"en": "IF counter < {n} → GO TO {a}"}, "FIN": {"en": "END"}, "pan": {"en": "bread"}, "jamón": {"en": "ham"}, "tomate": {"en": "tomato"}, "queso": {"en": "cheese"}, "lechuga": {"en": "lettuce"}, "SÍ": {"en": "YES"}, "NO": {"en": "NO"}, "el procesador mira el contador de programa (PC = {pc}) y trae la instrucción guardada en la dirección {pc} de la memoria.": {"en": "the processor looks at the program counter (PC = {pc}) and fetches the instruction stored at address {pc} in memory."}, "la unidad de control traduce el código binario {b}: significa «{t}».": {"en": "the control unit translates the binary code {b}: it means «{t}»."}, "envía la orden al robot cocinero: «{t}». Después, el PC pasa a la siguiente dirección.": {"en": "it sends the order to the robot chef: «{t}». Then the PC moves on to the next address."}, "guarda el número 0 en el registro «contador». Lo usará para contar.": {"en": "it stores the number 0 in the «counter» register. It will use it to count."}, "la ALU hace una suma: {a} + 1 = {b}, y guarda el resultado en «contador».": {"en": "the ALU adds: {a} + 1 = {b}, and stores the result in «counter»."}, "la ALU compara {c} < {n} → <b>SÍ</b>. El PC salta otra vez a la dirección {a}. ¡Esto es un bucle!": {"en": "the ALU compares {c} < {n} → <b>YES</b>. The PC jumps back to address {a}. This is a loop!"}, "la ALU compara {c} < {n} → <b>NO</b>. Se acabó el bucle: el PC sigue con la siguiente instrucción.": {"en": "the ALU compares {c} < {n} → <b>NO</b>. The loop is over: the PC continues with the next instruction."}, "El ordenador ha obedecido exactamente… pero el bocadillo ha salido mal porque el algoritmo tenía un <b>bug</b>. 🐛": {"en": "The computer obeyed exactly… but the sandwich came out wrong because the algorithm had a <b>bug</b>. 🐛"}, "¡Bocadillo terminado! El ordenador ha seguido el algoritmo instrucción por instrucción. 😋": {"en": "Sandwich done! The computer followed the algorithm instruction by instruction. 😋"}, "🏆 <b>¡Habéis completado todos los niveles!</b> Ya sois programadores.": {"en": "🏆 <b>You have completed every level!</b> You are programmers now."}, "👤 Nombre y apellidos:": {"en": "👤 Name and surname:"}, "Escribe aquí tu nombre y apellidos": {"en": "Type your name and surname here"}, "🖨️ Imprimir (JPG)": {"en": "🖨️ Print (JPG)"}, "✏️ Escribe primero tu nombre y apellidos.": {"en": "✏️ Type your name and surname first."}, "✅ Imagen guardada.": {"en": "✅ Image saved."}, "Descarga cancelada.": {"en": "Download cancelled."}, "Programa el robot": {"en": "Program the robot"}, "Nivel {a}: {t}": {"en": "Level {a}: {t}"}, "Nivel": {"en": "Level"}, "Reto": {"en": "Challenge"}, "Solución del alumno": {"en": "Student’s solution"}, "✅ SOLUCIÓN CORRECTA": {"en": "✅ CORRECT SOLUTION"}, "❌ SOLUCIÓN NO CORRECTA": {"en": "❌ INCORRECT SOLUTION"}, "El robot llega a la meta.": {"en": "The robot reaches the goal."}, "Funciona en los {n} mapas de prueba.": {"en": "It works on all {n} test maps."}, "⭐ Programa perfecto: usa el mínimo de bloques ({c}).": {"en": "⭐ Perfect program: it uses the minimum number of blocks ({c})."}, "Usa {c} bloques (el mínimo posible es {p}).": {"en": "It uses {c} blocks (the minimum possible is {p})."}, "El programa está vacío.": {"en": "The program is empty."}, "El robot choca con una pared.": {"en": "The robot crashes into a wall."}, "El programa no termina nunca (bucle infinito).": {"en": "The program never ends (infinite loop)."}, "El robot no llega a la meta.": {"en": "The robot does not reach the goal."}, "Faltan estrellas por recoger.": {"en": "Some stars were not collected."}, "Usa más bloques de los permitidos ({c} de {l}).": {"en": "It uses more blocks than allowed ({c} of {l})."}, "Falla en el mapa de prueba {k} de {n}.": {"en": "It fails on test map {k} of {n}."}, "Mapa de prueba {k} de {n}": {"en": "Test map {k} of {n}"}, "(programa vacío)": {"en": "(empty program)"}, "Recorrido del robot con este programa": {"en": "The robot’s route with this program"}, "Mantén pulsada la imagen (o clic derecho) y elige «Guardar imagen».": {"en": "Press and hold the image (or right-click) and choose «Save image»."}, "⬇️ Descargar JPG": {"en": "⬇️ Download JPG"}, "Cerrar": {"en": "Close"}, "Prácticas de Computación y Robótica 1º ESO": {"en": "Computing & Robotics Activities · Year 7 (1º ESO)"}, "🤖 Programa el robot · 12 prácticas": {"en": "🤖 Program the robot · 12 activities"}, "Práctica {a} de {b}": {"en": "Activity {a} of {b}"}, "¡Práctica superada!": {"en": "Activity complete!"}, "Siguiente práctica →": {"en": "Next activity →"}, "🏆 <b>¡Habéis completado todas las prácticas!</b> Ya sois programadores.": {"en": "🏆 <b>You have completed all the activities!</b> You are programmers now."}, "Práctica {a}: {t}": {"en": "Activity {a}: {t}"}, "Práctica": {"en": "Activity"}, "🤖 Programa el robot · 24 prácticas": {"en": "🤖 Program the robot · 24 activities"}, "💬 El robot ha dicho: {n}": {"en": "💬 The robot said: {n}"}, "📡 Si debajo hay": {"en": "📡 If underneath there is"}, "una planta 🌱": {"en": "a plant 🌱"}, "una manzana madura 🍎": {"en": "a ripe apple 🍎"}, "una oveja 🐑": {"en": "a sheep 🐑"}, "hojas 🍂": {"en": "leaves 🍂"}, "un paquete 📦": {"en": "a parcel 📦"}, "🖌️ Pintar casilla": {"en": "🖌️ Paint square"}, "✋ Coger paquete": {"en": "✋ Pick up parcel"}, "📦 Dejar paquete": {"en": "📦 Drop parcel"}, "💧 Regar": {"en": "💧 Water"}, "🧺 Recoger manzana": {"en": "🧺 Pick apple"}, "🧹 Barrer": {"en": "🧹 Sweep"}, "🔢 contador = 0": {"en": "🔢 counter = 0"}, "➕ Sumar 1 al contador": {"en": "➕ Add 1 to counter"}, "💬 Decir el contador": {"en": "💬 Say the counter"}, "🧩 Definir «mi función»": {"en": "🧩 Define «my function»"}, "▶ Usar «mi función»": {"en": "▶ Use «my function»"}, "🧩 Solo puede haber una «mi función».": {"en": "🧩 There can only be one «my function»."}, "(salto a «mi función»)": {"en": "(jump to «my function»)"}, "(vuelvo de «mi función»)": {"en": "(back from «my function»)"}, "🧩 Usas «mi función», pero no la has definido. Añade el bloque «Definir mi función».": {"en": "🧩 You use «my function» but haven’t defined it. Add the «Define my function» block."}, "♾️ La función se llama a sí misma sin parar.": {"en": "♾️ The function keeps calling itself forever."}, "♾️ ¡Bucle infinito! El programa no termina nunca.": {"en": "♾️ Infinite loop! The program never ends."}, "💥 ¡Choque! El robot ha chocado. Eso es un <b>bug</b>: busca la instrucción que falla (está marcada en amarillo).": {"en": "💥 Crash! The robot hit something. That is a <b>bug</b>: find the instruction that goes wrong (it is highlighted in yellow)."}, "✋ ¡Ya llevas un paquete! Primero déjalo en una casa.": {"en": "✋ You are already carrying a parcel! Drop it at a house first."}, "✋ Aquí no hay ningún paquete que coger.": {"en": "✋ There is no parcel to pick up here."}, "📦 No llevas ningún paquete.": {"en": "📦 You are not carrying a parcel."}, "📦 ¡Aquí no hay ninguna casa! Los paquetes se dejan en las casas.": {"en": "📦 There is no house here! Parcels are dropped at houses."}, "💧 ¡Aquí no hay nada que regar!": {"en": "💧 There is nothing to water here!"}, "🧺 Aquí no hay ninguna manzana madura.": {"en": "🧺 There is no ripe apple here."}, "🧹 ¡Aquí no hay hojas que barrer!": {"en": "🧹 There are no leaves to sweep here!"}, "🔢 Primero tienes que poner el contador a 0.": {"en": "🔢 First you have to set the counter to 0."}, "🖌️ Has pintado casillas que no están marcadas.": {"en": "🖌️ You painted squares that are not marked."}, "🖌️ Te faltan casillas por pintar.": {"en": "🖌️ Some squares still need painting."}, "📦 Quedan paquetes sin entregar.": {"en": "📦 Some parcels have not been delivered."}, "💧 Quedan plantas sin regar.": {"en": "💧 Some plants have not been watered."}, "🍎 Quedan árboles sin atender.": {"en": "🍎 Some trees have not been looked after."}, "🍂 Quedan hojas sin barrer.": {"en": "🍂 Some leaves have not been swept."}, "💬 El robot no ha dicho ningún número. Usa «Decir el contador» al final.": {"en": "💬 The robot didn’t say any number. Use «Say the counter» at the end."}, "💬 El robot ha dicho {a}, pero la respuesta correcta es {b}.": {"en": "💬 The robot said {a}, but the correct answer is {b}."}, "🧩 Esta práctica hay que resolverla usando «mi función».": {"en": "🧩 This activity must be solved using «my function»."}, "📦 carga": {"en": "📦 load"}, "🔢 contador": {"en": "🔢 counter"}, "💬 dijo": {"en": "💬 said"}, "📡 debajo": {"en": "📡 underneath"}, "El robot pintor 🖌️": {"en": "The painter robot 🖌️"}, "Pinta las casillas marcadas con línea discontinua. El robot pinta la casilla en la que está.": {"en": "Paint the squares marked with a dashed line. The robot paints the square it is standing on."}, "<b>Salida:</b> un programa no solo mueve cosas: también puede crear un resultado, como un dibujo.": {"en": "<b>Output:</b> a program doesn’t just move things: it can also create a result, like a drawing."}, "El marco": {"en": "The frame"}, "Pinta el borde del cuadrado con <b>5 bloques</b> como máximo.": {"en": "Paint the border of the square with at most <b>5 blocks</b>."}, "<b>Bucles anidados:</b> un lado = 3 × (pintar + avanzar); el marco = 4 × (lado + girar).": {"en": "<b>Nested loops:</b> one side = 3 × (paint + move); the frame = 4 × (side + turn)."}, "El collar de cuentas": {"en": "The bead necklace"}, "Pinta una casilla sí y otra no alrededor del cuadrado. Máximo <b>6 bloques</b>.": {"en": "Paint every other square around the square. Maximum <b>6 blocks</b>."}, "<b>Patrones:</b> encuentra la parte que se repite (pintar, avanzar, avanzar) y repítela.": {"en": "<b>Patterns:</b> find the part that repeats (paint, move, move) and repeat it."}, "Mi primera función 🧩": {"en": "My first function 🧩"}, "Pinta los tres cuadrados. Primero <b>define «mi función»</b> para pintar un cuadrado de 2×2 y después úsala tres veces. Pista: repetir 4 veces (pintar, avanzar, girar derecha).": {"en": "Paint the three squares. First <b>define «my function»</b> to paint a 2×2 square, then use it three times. Hint: repeat 4 times (paint, move forward, turn right)."}, "<b>Funciones:</b> le pones nombre a un trozo de programa y lo usas todas las veces que quieras.": {"en": "<b>Functions:</b> you give a piece of program a name and use it as many times as you like."}, "Las cuatro esquinas": {"en": "The four corners"}, "Pinta los cuatro cuadrados de las esquinas usando <b>«mi función»</b> dentro de un bucle. Ojo: el cuadrado se pinta según hacia dónde mira el robot.": {"en": "Paint the four corner squares using <b>«my function»</b> inside a loop. Careful: the square is painted according to where the robot is facing."}, "<b>Reutilizar:</b> la misma función funciona en cualquier sitio y en cualquier dirección.": {"en": "<b>Reuse:</b> the same function works anywhere and in any direction."}, "El repartidor 📦": {"en": "The delivery robot 📦"}, "Coge el paquete 📦 y llévalo a la casa 🏠.": {"en": "Pick up the parcel 📦 and take it to the house 🏠."}, "<b>Estado:</b> el ordenador recuerda si el robot lleva un paquete o no. Eso es información guardada en memoria.": {"en": "<b>State:</b> the computer remembers whether the robot is carrying a parcel. That is information stored in memory."}, "Reparto en cadena": {"en": "Chain delivery"}, "Lleva cada paquete a la casa que tiene a su derecha. Máximo <b>5 bloques</b>.": {"en": "Take each parcel to the house on its right. Maximum <b>5 blocks</b>."}, "<b>Patrón con estado:</b> coger, avanzar, dejar… y otra vez. El robot nunca lleva dos paquetes a la vez.": {"en": "<b>Pattern with state:</b> pick up, move, drop… and again. The robot never carries two parcels at once."}, "El jardinero 🎲": {"en": "The gardener 🎲"}, "Riega solo las macetas que tienen planta 🌱. Si riegas tierra vacía, ¡error! Las plantas cambian en cada prueba: se probará en <b>3 jardines</b>. Máximo 6 bloques.": {"en": "Water only the pots that have a plant 🌱. If you water empty soil: error! The plants change in every test: it will be tested in <b>3 gardens</b>. Maximum 6 blocks."}, "<b>Condición:</b> el robot mira con su sensor qué hay debajo y decide si regar o no.": {"en": "<b>Condition:</b> the robot checks with its sensor what is underneath and decides whether to water or not."}, "La cosecha 🎲": {"en": "The harvest 🎲"}, "En cada árbol hay una manzana: si está <b>madura 🍎</b>, recógela; si está <b>verde 🍏</b>, riégala. Se probará en <b>3 huertos</b>. Máximo 8 bloques.": {"en": "Each tree has an apple: if it is <b>ripe 🍎</b>, pick it; if it is <b>green 🍏</b>, water it. It will be tested in <b>3 orchards</b>. Maximum 8 blocks."}, "<b>Si… si no:</b> siempre se hace una de las dos cosas, nunca las dos.": {"en": "<b>If… else:</b> one of the two things is always done, never both."}, "Cuenta ovejas 🎲": {"en": "Count the sheep 🎲"}, "Recorre el prado, cuenta cuántas ovejas 🐑 hay y al final haz que el robot <b>diga</b> el número. Se probará en <b>3 prados</b>. Máximo 9 bloques.": {"en": "Walk across the meadow, count how many sheep 🐑 there are and at the end make the robot <b>say</b> the number. It will be tested in <b>3 meadows</b>. Maximum 9 blocks."}, "<b>Variables:</b> el «contador» es una caja en la memoria donde el programa guarda un número que va cambiando.": {"en": "<b>Variables:</b> the «counter» is a box in memory where the program keeps a number that changes."}, "El barrendero 🎲": {"en": "The street sweeper 🎲"}, "Barre las hojas 🍂 del andén hasta llegar a la valla 🚧. ¡La valla está en un sitio distinto en cada prueba! Se probará en <b>3 andenes</b>. Máximo 6 bloques.": {"en": "Sweep the leaves 🍂 on the platform until you reach the fence 🚧. The fence is in a different place in every test! It will be tested on <b>3 platforms</b>. Maximum 6 blocks."}, "<b>Mientras + si:</b> repetir sin saber cuántas veces y decidir en cada paso.": {"en": "<b>While + if:</b> repeat without knowing how many times and decide at each step."}, "Gran final: el granjero 🏆🎲": {"en": "Grand finale: the farmer 🏆🎲"}, "Usa <b>«mi función»</b> para atender cada árbol (recoger si está madura, regar si está verde), <b>cuenta</b> las manzanas recogidas y al final <b>di</b> el número. Se probará en <b>3 huertos</b>.": {"en": "Use <b>«my function»</b> to look after each tree (pick if ripe, water if green), <b>count</b> the apples picked and at the end <b>say</b> the number. It will be tested in <b>3 orchards</b>."}, "<b>Pensamiento computacional:</b> descomponer, buscar patrones, usar funciones, condiciones y variables… ¡todo junto!": {"en": "<b>Computational thinking:</b> decomposing, finding patterns, using functions, conditions and variables… all together!"}, "Atrapa al gusano 🐛": {"en": "Catch the worm 🐛"}, "Pulsa «⏭ Paso a paso» y fíjate en el primer escalón: ¿el robot baja hacia el gusano o se va hacia arriba? Un error está en los <b>giros</b> y el otro en el <b>número de vueltas</b>.": {"en": "Press «⏭ Step by step» and watch the first step of the stairs: does the robot go down towards the worm or up? One bug is in the <b>turns</b> and the other in the <b>number of loops</b>."}, "Para bajar un escalón, el robot tiene que avanzar, girar a la <b>derecha</b>, avanzar y girar a la <b>izquierda</b>: en el programa los dos giros están al revés. Después cuenta los escalones que hay hasta el gusano: el bucle debe dar una vuelta por cada escalón.": {"en": "To go down one step, the robot must move forward, turn <b>right</b>, move forward and turn <b>left</b>: in the program the two turns are the wrong way round. Then count the steps down to the worm: the loop must run once for each step."}, "No cuentes los pasos: usa «Repetir hasta llegar a la meta». Dentro del bucle, el robot solo tiene que decidir una cosa en cada paso: ¿hay pared delante o no?": {"en": "Don't count the steps: use «Repeat until reaching the goal». Inside the loop the robot only has to decide one thing at each step: is there a wall ahead or not?"}, "Dentro de «Repetir hasta llegar a la meta» van dos bloques, uno debajo del otro: primero «Si hay pared delante» con «Girar derecha» dentro; después, fuera del «si» pero dentro del bucle, «Avanzar».": {"en": "Inside «Repeat until reaching the goal» put two blocks, one under the other: first «If there is a wall ahead» with «Turn right» inside it; then, outside the «if» but still inside the loop, «Move forward»."}, "El camino es como una escalera de dos escalones: un tramo hacia arriba y otro hacia la derecha, y otra vez lo mismo. Para recorrer un tramo sin contar pasos, usa «Mientras haya camino delante» con «Avanzar» dentro.": {"en": "The path is like a staircase with two steps: one stretch up and one to the right, and then the same again. To cover a stretch without counting steps, use «While there is a path ahead» with «Move forward» inside it."}, "Un escalón es: (Mientras haya camino delante → Avanzar), Girar derecha, (Mientras haya camino delante → Avanzar), Girar izquierda. Mete el escalón dentro de un «Repetir» con tantas vueltas como escalones hay.": {"en": "One step is: (While there is a path ahead → Move forward), Turn right, (While there is a path ahead → Move forward), Turn left. Put that step inside a «Repeat» with as many loops as there are steps."}, "Usa «Repetir hasta llegar a la meta». En cada vuelta el robot pregunta: ¿hay camino delante? Si no lo hay, tiene que girar… pero ¿hacia qué lado? Para saberlo necesita hacer otra pregunta.": {"en": "Use «Repeat until reaching the goal». On each loop the robot asks: is there a path ahead? If not, it has to turn… but which way? To find out it needs to ask another question."}, "Dentro del bucle: «Si hay camino delante» → Avanzar; «si no» → otro «Si hay camino a la izquierda» → Girar izquierda; «si no» → Girar derecha. No hace falta avanzar después de girar: lo hará en la vuelta siguiente.": {"en": "Inside the loop: «If there is a path ahead» → Move forward; «else» → another «If there is a path on the left» → Turn left; «else» → Turn right. You don't need to move forward after turning: it will do that on the next loop."}, "Usa «Repetir hasta llegar a la meta» y la regla de la mano derecha. En cada vuelta el robot mira en este orden: primero a la <b>derecha</b>, después <b>delante</b> y, si todo está cerrado, gira a la <b>izquierda</b>.": {"en": "Use «Repeat until reaching the goal» and the right-hand rule. On each loop the robot looks in this order: first to the <b>right</b>, then <b>ahead</b>, and if everything is blocked it turns <b>left</b>."}, "Dentro del bucle: «Si hay camino a la derecha» → Girar derecha y Avanzar; «si no» → (Si hay camino delante → Avanzar; si no → Girar izquierda). En un callejón sin salida girará a la izquierda dos veces y así dará media vuelta.": {"en": "Inside the loop: «If there is a path on the right» → Turn right and Move forward; «else» → (If there is a path ahead → Move forward; else → Turn left). In a dead end it will turn left twice and so turn around."}, "Divide el problema en dos fases: primero recorre el laberinto hasta tener todas las estrellas; después vuelve a la base. La regla de la mano derecha de «El laberinto» (práctica 10) entra en todos los callejones y acaba volviendo al principio.": {"en": "Split the problem into two phases: first explore the maze until you have all the stars; then go back to the base. The right-hand rule from «The maze» (activity 10) goes into every dead end and ends up back at the start."}, "Pon dos bucles, uno debajo del otro: «Repetir hasta tener todas las ⭐» y «Repetir hasta llegar a la meta 🏁». Dentro de cada uno va la misma regla de la mano derecha: si hay camino a la derecha → girar derecha y avanzar; si no, si hay camino delante → avanzar; si no → girar izquierda.": {"en": "Use two loops, one under the other: «Repeat until all ⭐ collected» and «Repeat until reaching the goal 🏁». Inside each one goes the same right-hand rule: if there is a path on the right → turn right and move forward; else, if there is a path ahead → move forward; else → turn left."}, "No necesitas ver el mapa: una regla que solo usa los sensores sirve para cualquier laberinto. ¿Recuerdas la que usaste en «El laberinto» (práctica 10)?": {"en": "You don't need to see the map: a rule that only uses the sensors works in any maze. Do you remember the one you used in «The maze» (activity 10)?"}, "Usa la regla de la mano derecha dentro de «Repetir hasta llegar a la meta»: si hay camino a la derecha → girar derecha y avanzar; si no, si hay camino delante → avanzar; si no → girar izquierda.": {"en": "Use the right-hand rule inside «Repeat until reaching the goal»: if there is a path on the right → turn right and move forward; else, if there is a path ahead → move forward; else → turn left."}, "«Pintar casilla» solo pinta la casilla en la que está el robot en ese momento. Cuenta cuántas casillas marcadas hay en la fila.": {"en": "«Paint square» only paints the square the robot is standing on at that moment. Count how many marked squares there are in the row."}, "Alterna los dos bloques: Pintar, Avanzar, Pintar, Avanzar… Hay 5 casillas, así que necesitas 5 «Pintar». Termina con «Pintar» en la última casilla.": {"en": "Alternate the two blocks: Paint, Move forward, Paint, Move forward… There are 5 squares, so you need 5 «Paint» blocks. Finish with «Paint» on the last square."}, "Mira el marco como 4 lados iguales. Programa primero un solo lado y después repítelo.": {"en": "Think of the frame as 4 equal sides. First program just one side and then repeat it."}, "Un lado = «Repetir» (Pintar, Avanzar) y, en la esquina, «Girar derecha». Mete todo eso dentro de otro «Repetir 4 veces». Cuenta cuántas casillas pinta el robot en un lado antes de girar: cada esquina se pinta una sola vez.": {"en": "One side = «Repeat» (Paint, Move forward) and, at the corner, «Turn right». Put all of that inside another «Repeat 4 times». Count how many squares the robot paints on one side before turning: each corner is painted only once."}, "Es como «El marco», pero pintando una casilla sí y otra no. Busca el trozo pequeño que se repite a lo largo de cada lado.": {"en": "It's like «The frame», but painting every other square. Look for the small piece that repeats along each side."}, "Estructura: Repetir 4 veces → [ Repetir ? veces → (Pintar, Avanzar, Avanzar), Girar derecha ]. Cuenta cuántas cuentas pinta el robot en un lado antes de girar y sabrás el número que falta.": {"en": "Structure: Repeat 4 times → [ Repeat ? times → (Paint, Move forward, Move forward), Turn right ]. Count how many beads the robot paints on one side before turning and you'll know the missing number."}, "Primero consigue que el robot pinte <b>un</b> cuadrado de 2×2 y termine donde empezó, mirando hacia el mismo lado. Ese trozo va dentro de «Definir mi función». Después solo tienes que ir de un cuadrado a otro.": {"en": "First get the robot to paint <b>one</b> 2×2 square and finish where it started, facing the same way. That piece goes inside «Define my function». After that you only need to get from one square to the next."}, "Dentro de «Definir mi función»: Repetir 4 veces (Pintar, Avanzar, Girar derecha). En el programa principal: Usar mi función, avanzar hasta el siguiente cuadrado, Usar mi función… Cuenta cuántos pasos hay de un cuadrado al siguiente; con «Repetir» no tendrás que escribirlo dos veces.": {"en": "Inside «Define my function»: Repeat 4 times (Paint, Move forward, Turn right). In the main program: Use my function, move forward to the next square, Use my function… Count how many steps there are from one square to the next; with «Repeat» you won't have to write it twice."}, "Usa la misma función de la práctica anterior (un cuadrado de 2×2). Las cuatro esquinas son iguales: pinta una, ve hasta la siguiente esquina y gira. Eso se repite 4 veces.": {"en": "Use the same function as in the previous activity (a 2×2 square). The four corners are the same: paint one, go to the next corner and turn. That repeats 4 times."}, "Programa principal: Repetir 4 veces → [ Usar mi función, Repetir ? veces (Avanzar), Girar derecha ]. Cuenta cuántos pasos hay desde una esquina hasta la siguiente.": {"en": "Main program: Repeat 4 times → [ Use my function, Repeat ? times (Move forward), Turn right ]. Count how many steps there are from one corner to the next."}, "Divide el problema en dos partes: primero llega al paquete y cógelo; después llega a la casa y déjalo. Para coger o dejar, el robot tiene que estar <b>encima</b> de esa casilla.": {"en": "Split the problem into two parts: first reach the parcel and pick it up; then reach the house and drop it. To pick up or drop, the robot has to be standing <b>on</b> that square."}, "Avanza hasta el paquete y usa «Coger paquete». Sigue avanzando hasta la columna de la casa, gira a la izquierda para mirar hacia arriba, avanza hasta la casa y usa «Dejar paquete». Para los tramos largos puedes usar «Repetir».": {"en": "Move forward to the parcel and use «Pick up parcel». Keep going until you are in the house's column, turn left to face up, move forward to the house and use «Drop parcel». For the long stretches you can use «Repeat»."}, "Fíjate en el patrón: paquete, casa, paquete, casa… Lo que hace el robot con el primer paquete es exactamente lo mismo que con los otros dos.": {"en": "Look at the pattern: parcel, house, parcel, house… What the robot does with the first parcel is exactly the same as with the other two."}, "Para un paquete: Avanzar, Coger paquete, Avanzar, Dejar paquete. Mete esos 4 bloques dentro de un «Repetir» con tantas vueltas como paquetes hay.": {"en": "For one parcel: Move forward, Pick up parcel, Move forward, Drop parcel. Put those 4 blocks inside a «Repeat» with as many loops as there are parcels."}, "En cada maceta el robot hace lo mismo: mira si hay planta, la riega si la hay y pasa a la siguiente. Usa «Repetir» y «Si debajo hay una planta».": {"en": "At each pot the robot does the same thing: it checks if there is a plant, waters it if there is, and moves on to the next one. Use «Repeat» and «If underneath there is a plant»."}, "Dentro de «Repetir»: (Si debajo hay una planta → Regar), Avanzar. ¡Cuidado con la última maceta! Si avanzas desde ella, el robot choca con el borde. Repite una vuelta menos que el número de macetas y revisa la última con otro «si» al final.": {"en": "Inside «Repeat»: (If underneath there is a plant → Water), Move forward. Careful with the last pot! If you move forward from it, the robot crashes into the edge. Loop one time fewer than the number of pots and check the last one with another «if» at the end."}, "Es como «El jardinero», pero ahora en cada árbol hay que hacer siempre una cosa: recoger o regar. Usa «Si debajo hay… si no».": {"en": "It's like «The gardener», but now you always have to do something at each tree: pick or water. Use «If underneath there is… else»."}, "Dentro de «Repetir»: [Si debajo hay una manzana madura → Recoger manzana; si no → Regar], Avanzar. Igual que en el jardín, el último árbol se atiende fuera del bucle, con otro «si… si no», para no chocar con el borde.": {"en": "Inside «Repeat»: [If underneath there is a ripe apple → Pick apple; else → Water], Move forward. Just like in the garden, the last tree is handled outside the loop, with another «if… else», so you don't crash into the edge."}, "Necesitas una variable: al principio pon el contador a 0, suma 1 cada vez que el robot esté encima de una oveja y, al terminar el recorrido, di el contador.": {"en": "You need a variable: at the start set the counter to 0, add 1 each time the robot is on a sheep and, at the end of the route, say the counter."}, "Orden: «contador = 0»; Repetir → (Si debajo hay una oveja → Sumar 1 al contador), Avanzar; revisa la última casilla con otro «si»; y al final «Decir el contador». Cuidado: si pones «contador = 0» dentro del bucle, la cuenta se borra en cada vuelta.": {"en": "Order: «counter = 0»; Repeat → (If underneath there is a sheep → Add 1 to counter), Move forward; check the last square with another «if»; and at the end «Say the counter». Careful: if you put «counter = 0» inside the loop, the count is wiped on every loop."}, "No sabes dónde está la valla, así que no puedes contar los pasos. Usa «Mientras haya camino delante» y, en cada casilla, mira si hay hojas antes de avanzar.": {"en": "You don't know where the fence is, so you can't count the steps. Use «While there is a path ahead» and, on each square, check for leaves before moving on."}, "Mientras haya camino delante → (Si debajo hay hojas → Barrer), Avanzar. Cuando el bucle termina, el robot está en la última casilla y todavía no la ha revisado: añade otro «Si debajo hay hojas → Barrer» al final.": {"en": "While there is a path ahead → (If underneath there are leaves → Sweep), Move forward. When the loop ends, the robot is on the last square and hasn't checked it yet: add another «If underneath there are leaves → Sweep» at the end."}, "Descompón el problema. «Mi función» atiende <b>un solo</b> árbol: recoger (y contar) si la manzana está madura, o regar si está verde. El programa principal pone el contador a 0, recorre la fila usando la función y al final dice el número.": {"en": "Break the problem down. «My function» looks after <b>one</b> tree: pick (and count) if the apple is ripe, or water it if it is green. The main program sets the counter to 0, goes along the row using the function and at the end says the number."}, "Dentro de «Definir mi función»: Si debajo hay una manzana madura → Recoger manzana y Sumar 1 al contador; si no → Regar. Programa principal: contador = 0, Repetir (Usar mi función, Avanzar), Usar mi función en el último árbol y Decir el contador.": {"en": "Inside «Define my function»: If underneath there is a ripe apple → Pick apple and Add 1 to counter; else → Water. Main program: counter = 0, Repeat (Use my function, Move forward), Use my function on the last tree, and Say the counter."}, "💡 Ayuda 1": {"en": "💡 Hint 1"}, "💡 Ayuda 2": {"en": "💡 Hint 2"}, "💡 Ayuda {n}:": {"en": "💡 Hint {n}:"}, "Primero abre la ayuda 1.": {"en": "Open hint 1 first."}, "Intenta resolverla sin ayuda. Si usas una ayuda, quedará anotado en la corrección.": {"en": "Try to solve it without help. If you use a hint, it will be noted in the marking."}, "Has usado 1 ayuda: quedará anotado en la corrección.": {"en": "You have used 1 hint: it will be noted in the marking."}, "Has usado 2 ayudas: quedará anotado en la corrección.": {"en": "You have used 2 hints: it will be noted in the marking."}, "¿Seguro que quieres abrir la ayuda {n}? La corrección indicará que la has usado.": {"en": "Are you sure you want to open hint {n}? The marking will show that you used it."}, "Sí, ver la ayuda": {"en": "Yes, show the hint"}, "No, sigo probando": {"en": "No, I'll keep trying"}, "✅ Correcta sin ayudas": {"en": "✅ Correct without hints"}, "✅ Correcta con 1 ayuda": {"en": "✅ Correct with 1 hint"}, "✅ Correcta con 2 ayudas": {"en": "✅ Correct with 2 hints"}, "✅ SOLUCIÓN CORRECTA SIN AYUDAS": {"en": "✅ CORRECT SOLUTION WITHOUT HINTS"}, "✅ SOLUCIÓN CORRECTA CON 1 AYUDA": {"en": "✅ CORRECT SOLUTION WITH 1 HINT"}, "✅ SOLUCIÓN CORRECTA CON 2 AYUDAS": {"en": "✅ CORRECT SOLUTION WITH 2 HINTS"}, "💡 No ha usado ninguna ayuda.": {"en": "💡 No hints used."}, "💡 Ha usado la ayuda 1.": {"en": "💡 Used hint 1."}, "💡 Ha usado las ayudas 1 y 2.": {"en": "💡 Used hints 1 and 2."}, "🆘 Ayuda 3": {"en": "🆘 Hint 3"}, "🆘 Ayuda 3:": {"en": "🆘 Hint 3:"}, "Primero abre la ayuda 2.": {"en": "Open hint 2 first."}, "Has usado 3 ayudas: quedará anotado en la corrección.": {"en": "You have used 3 hints: it will be noted in the marking."}, "La ayuda 3 te da la solución completa. ¿Seguro que quieres abrirla? La corrección indicará que has resuelto la práctica con gran dificultad.": {"en": "Hint 3 gives you the complete solution. Are you sure you want to open it? The marking will show that you solved the activity with great difficulty."}, "La solución completa ya está en tu programa. Pulsa «▶ Ejecutar» para comprobarla y fíjate en cómo funciona cada bloque.": {"en": "The complete solution is now in your program. Press «▶ Run» to check it and look at how each block works."}, "↺ Volver a poner la solución": {"en": "↺ Put the solution back"}, "✅ Correcta con 3 ayudas: gran dificultad": {"en": "✅ Correct with 3 hints: great difficulty"}, "💡 Ha usado las ayudas 1, 2 y 3 (solución completa).": {"en": "💡 Used hints 1, 2 and 3 (complete solution)."}, "✅ CORRECTA CON 3 AYUDAS: GRAN DIFICULTAD": {"en": "✅ CORRECT WITH 3 HINTS: GREAT DIFFICULTY"}, "Pinta la fila 🖌️": {"en": "Paint the row 🖌️"}, "Pinta las 5 casillas marcadas con línea discontinua. El robot pinta la casilla en la que está. Solo puedes usar <b>3 bloques</b>.": {"en": "Paint the 5 squares marked with a dashed line. The robot paints the square it is on. You can only use <b>3 blocks</b>."}, "<b>Bucle:</b> «Repetir» también sirve para pintar: pinta, avanza… y otra vez.": {"en": "<b>Loop:</b> «Repeat» also works for painting: paint, move forward… and again."}, "¿Qué hace el robot en cada casilla? Primero pinta y después avanza. Eso se repite.": {"en": "What does the robot do on each square? First it paints and then it moves forward. That repeats."}, "Mete «Pintar casilla» y «Avanzar» dentro de un «Repetir». Cuenta las casillas marcadas para saber cuántas veces.": {"en": "Put «Paint square» and «Move forward» inside a «Repeat». Count the marked squares to know how many times."}, "La letra L": {"en": "The letter L"}, "Pinta la letra L: primero la parte de arriba y después baja. Máximo <b>7 bloques</b>.": {"en": "Paint the letter L: first the top part and then go down. Maximum <b>7 blocks</b>."}, "<b>Secuencia de bucles:</b> un bucle para un tramo, un giro y otro bucle para el siguiente tramo.": {"en": "<b>Loops in sequence:</b> one loop for one stretch, a turn, and another loop for the next stretch."}, "Divide la L en dos tramos: el de arriba, hacia la derecha, y el de bajada. Entre los dos, el robot gira una vez.": {"en": "Split the L into two stretches: the top one, to the right, and the one going down. Between them the robot turns once."}, "Repetir (Pintar, Avanzar) para el tramo de arriba, después «Girar derecha» y otro Repetir (Pintar, Avanzar) para bajar. La esquina se pinta en el segundo tramo. Cuenta las casillas de cada tramo.": {"en": "Repeat (Paint, Move forward) for the top stretch, then «Turn right» and another Repeat (Paint, Move forward) to go down. The corner is painted in the second stretch. Count the squares of each stretch."}, "Una sí, una no": {"en": "Every other one"}, "Pinta una casilla sí y otra no a lo largo de la fila. Máximo <b>5 bloques</b>.": {"en": "Paint every other square along the row. Maximum <b>5 blocks</b>."}, "<b>Patrones:</b> busca el trozo que se repite: pintar, avanzar, avanzar.": {"en": "<b>Patterns:</b> look for the piece that repeats: paint, move forward, move forward."}, "El trozo que se repite es: Pintar, Avanzar, Avanzar. ¿Cuántas veces cabe antes de llegar al final?": {"en": "The piece that repeats is: Paint, Move forward, Move forward. How many times does it fit before reaching the end?"}, "Repetir 3 veces (Pintar, Avanzar, Avanzar) y, al final, un «Pintar» más para la última casilla. Si repites 4 veces, el robot choca con el borde.": {"en": "Repeat 3 times (Paint, Move forward, Move forward) and, at the end, one more «Paint» for the last square. If you repeat 4 times, the robot crashes into the edge."}, "Pinta hasta la pared 🎲": {"en": "Paint up to the wall 🎲"}, "Pinta todo el pasillo. Su longitud cambia en cada mapa: <b>no puedes contar las casillas</b>. Se probará en <b>3 mapas</b>. Máximo 4 bloques.": {"en": "Paint the whole corridor. Its length changes on every map: <b>you can't count the squares</b>. It will be tested on <b>3 maps</b>. Maximum 4 blocks."}, "<b>Mientras:</b> repite mientras haya camino delante, sin saber cuántas veces.": {"en": "<b>While:</b> repeat while there is a path ahead, without knowing how many times."}, "Como en «Pasillos misteriosos» (práctica 8): usa «Mientras haya camino delante». Dentro, el robot pinta y avanza.": {"en": "As in «Mystery corridors» (activity 8): use «While there is a path ahead». Inside, the robot paints and moves forward."}, "Mientras haya camino delante → (Pintar, Avanzar). Cuando el bucle termina, el robot está en la última casilla y aún no la ha pintado: añade un «Pintar» al final.": {"en": "While there is a path ahead → (Paint, Move forward). When the loop ends, the robot is on the last square and hasn't painted it yet: add a «Paint» at the end."}, "El paquete del fondo 🎲": {"en": "The parcel at the end 🎲"}, "Ve hasta el final del pasillo, coge el paquete 📦 y tráelo a la casa 🏠 donde empiezas. El pasillo cambia de longitud: se probará en <b>3 mapas</b>. Máximo 8 bloques.": {"en": "Go to the end of the corridor, pick up the parcel 📦 and bring it to the house 🏠 where you start. The corridor changes length: it will be tested on <b>3 maps</b>. Maximum 8 blocks."}, "<b>Ida y vuelta:</b> dar media vuelta son dos giros; para volver sirve el mismo «mientras».": {"en": "<b>There and back:</b> turning around is two turns; to come back, the same «while» works."}, "Tres partes: ir hasta el final sin contar pasos, coger el paquete y volver. Para dar media vuelta, el robot gira dos veces hacia el mismo lado.": {"en": "Three parts: go to the end without counting steps, pick up the parcel and come back. To turn around, the robot turns twice to the same side."}, "(Mientras haya camino delante → Avanzar), Coger paquete, Girar derecha, Girar derecha, (Mientras haya camino delante → Avanzar), Dejar paquete.": {"en": "(While there is a path ahead → Move forward), Pick up parcel, Turn right, Turn right, (While there is a path ahead → Move forward), Drop parcel."}, "La escalera de la bandera 🎲": {"en": "The flag staircase 🎲"}, "Sube la escalera hasta la bandera 🏁. El número de escalones cambia en cada mapa: se probará en <b>3 escaleras</b>. Máximo 5 bloques.": {"en": "Climb the stairs up to the flag 🏁. The number of steps changes on every map: it will be tested on <b>3 staircases</b>. Maximum 5 blocks."}, "<b>Repetir hasta:</b> repite el patrón del escalón hasta llegar a la meta, tenga los escalones que tenga.": {"en": "<b>Repeat until:</b> repeat the step pattern until you reach the goal, however many steps there are."}, "Es como «La escalera» (práctica 4), pero no sabes cuántos escalones hay. Usa «Repetir hasta llegar a la meta».": {"en": "It's like «The staircase» (activity 4), but you don't know how many steps there are. Use «Repeat until reaching the goal»."}, "Dentro de «Repetir hasta llegar a la meta» pon un escalón: Avanzar, Girar izquierda, Avanzar, Girar derecha.": {"en": "Inside «Repeat until reaching the goal» put one step: Move forward, Turn left, Move forward, Turn right."}, "La espiral al revés 🎲": {"en": "The reverse spiral 🎲"}, "Como el robot aspirador, pero ahora la espiral gira hacia la <b>izquierda</b> y cambia de tamaño en cada mapa. Se probará en <b>3 espirales</b>. Máximo 4 bloques.": {"en": "Like the robot vacuum, but now the spiral turns to the <b>left</b> and changes size on every map. It will be tested on <b>3 spirals</b>. Maximum 4 blocks."}, "<b>Sensores:</b> la misma idea sirve para otro camino si cambias el giro.": {"en": "<b>Sensors:</b> the same idea works for another path if you change the turn."}, "Recuerda «El robot aspirador» (práctica 7). ¿Qué cambia aquí? Hacia qué lado gira el camino.": {"en": "Remember «The robot vacuum» (activity 7). What changes here? Which way the path turns."}, "Repetir hasta llegar a la meta → (Si hay pared delante → Girar izquierda), Avanzar. El «Avanzar» va fuera del «si», pero dentro del bucle.": {"en": "Repeat until reaching the goal → (If there is a wall ahead → Turn left), Move forward. «Move forward» goes outside the «if» but inside the loop."}, "Riega solo las macetas que tienen planta 🌱 y para en la bandera 🏁. Si riegas tierra vacía, ¡error! Las plantas cambian en cada prueba: se probará en <b>3 jardines</b>. Máximo 4 bloques.": {"en": "Water only the pots that have a plant 🌱 and stop at the flag 🏁. If you water empty soil, it's an error! The plants change in each test: it will be tested in <b>3 gardens</b>. Maximum 4 blocks."}, "En cada maceta el robot hace lo mismo: si hay planta, la riega; después avanza. Repite eso hasta llegar a la bandera.": {"en": "At each pot the robot does the same thing: if there is a plant, it waters it; then it moves forward. Repeat that until you reach the flag."}, "Repetir hasta llegar a la meta → (Si debajo hay una planta → Regar), Avanzar.": {"en": "Repeat until reaching the goal → (If underneath there is a plant → Water), Move forward."}, "Barre las hojas 🍂 del andén hasta llegar a la valla 🚧. ¡La valla está en un sitio distinto en cada prueba! Se probará en <b>3 andenes</b>. Máximo 4 bloques.": {"en": "Sweep the leaves 🍂 off the platform until you reach the fence 🚧. The fence is in a different place in each test! It will be tested on <b>3 platforms</b>. Maximum 4 blocks."}, "No sabes dónde está la valla: usa «Mientras haya camino delante». En cada casilla, mira si hay hojas antes de avanzar.": {"en": "You don't know where the fence is: use «While there is a path ahead». On each square, check for leaves before moving on."}, "Mientras haya camino delante → (Si debajo hay hojas → Barrer), Avanzar.": {"en": "While there is a path ahead → (If underneath there are leaves → Sweep), Move forward."}, "En cada árbol hay una manzana: si está <b>madura 🍎</b>, recógela; si está <b>verde 🍏</b>, riégala. Para en la bandera 🏁. Se probará en <b>3 huertos</b>. Máximo 5 bloques.": {"en": "On each tree there is an apple: if it is <b>ripe 🍎</b>, pick it; if it is <b>green 🍏</b>, water it. Stop at the flag 🏁. It will be tested in <b>3 orchards</b>. Maximum 5 blocks."}, "Es como «El jardinero», pero en cada árbol siempre hay que hacer algo: recoger o regar. Usa «Si debajo hay… si no».": {"en": "It's like «The gardener», but at each tree you always have to do something: pick or water. Use «If underneath there is… else»."}, "Repetir hasta llegar a la meta → [Si debajo hay una manzana madura → Recoger manzana; si no → Regar], Avanzar.": {"en": "Repeat until reaching the goal → [If underneath there is a ripe apple → Pick apple; else → Water], Move forward."}, "Reparto por la calle 🎲": {"en": "Deliveries along the street 🎲"}, "Por la calle hay paquetes 📦 y casas 🏠: coge cada paquete y déjalo en la siguiente casa. Para en la bandera 🏁. Cambian de sitio en cada prueba: se probará en <b>3 calles</b>. Máximo 6 bloques.": {"en": "Along the street there are parcels 📦 and houses 🏠: pick up each parcel and drop it at the next house. Stop at the flag 🏁. They change place in each test: it will be tested on <b>3 streets</b>. Maximum 6 blocks."}, "<b>Dos condiciones seguidas:</b> el robot pregunta dos cosas en cada casilla, una detrás de otra.": {"en": "<b>Two conditions in a row:</b> the robot asks two things on each square, one after the other."}, "En cada casilla el robot hace dos preguntas: ¿hay un paquete? Entonces lo coge. ¿Hay una casa? Entonces deja el paquete. Después avanza.": {"en": "On each square the robot asks two questions: is there a parcel? Then it picks it up. Is there a house? Then it drops the parcel. Then it moves forward."}, "Repetir hasta llegar a la meta → (Si debajo hay un paquete → Coger paquete), (Si debajo hay una casa → Dejar paquete), Avanzar. En el segundo «si», cambia «un paquete» por «una casa».": {"en": "Repeat until reaching the goal → (If underneath there is a parcel → Pick up parcel), (If underneath there is a house → Drop parcel), Move forward. In the second «if», change «a parcel» to «a house»."}, "Arregla el repartidor 🐞🎲": {"en": "Fix the delivery robot 🐞🎲"}, "Otro programador escribió este programa para repartir por la calle, pero tiene <b>2 errores</b>. Ejecútalo, mira qué falla y arréglalo. Se probará en <b>3 calles</b>.": {"en": "Another programmer wrote this program to deliver along the street, but it has <b>2 bugs</b>. Run it, see what goes wrong and fix it. It will be tested on <b>3 streets</b>."}, "<b>Depurar:</b> leer un programa con calma y encontrar qué instrucción está mal.": {"en": "<b>Debugging:</b> reading a program calmly and finding which instruction is wrong."}, "Pulsa «⏭ Paso a paso» y fíjate en la primera casilla con paquete: ¿qué intenta hacer el robot allí? ¿Tiene sentido?": {"en": "Press «⏭ Step by step» and watch the first square with a parcel: what does the robot try to do there? Does it make sense?"}, "Las dos acciones están cambiadas: donde hay un paquete hay que «Coger paquete», y donde hay una casa hay que «Dejar paquete». Cambia esos dos bloques.": {"en": "The two actions are swapped: where there is a parcel you must «Pick up parcel», and where there is a house you must «Drop parcel». Swap those two blocks."}, "Gran final: el aspirador de hojas 🏆🎲": {"en": "Grand finale: the leaf vacuum 🏆🎲"}, "El robot recorre una espiral que cambia en cada mapa y tiene que <b>barrer todas las hojas</b> 🍂 hasta llegar a la bandera 🏁. Se probará en <b>3 espirales</b>. Máximo 6 bloques.": {"en": "The robot travels along a spiral that changes on every map and has to <b>sweep all the leaves</b> 🍂 until it reaches the flag 🏁. It will be tested on <b>3 spirals</b>. Maximum 6 blocks."}, "<b>Todo junto:</b> un bucle, un sensor para el camino y otro para las hojas.": {"en": "<b>All together:</b> a loop, one sensor for the path and another for the leaves."}, "Junta dos prácticas: «El robot aspirador» (girar cuando hay pared) y «El barrendero» (barrer si hay hojas). Todo dentro de «Repetir hasta llegar a la meta».": {"en": "Combine two activities: «The robot vacuum» (turn when there is a wall) and «The street sweeper» (sweep if there are leaves). All inside «Repeat until reaching the goal»."}, "Repetir hasta llegar a la meta → (Si debajo hay hojas → Barrer), (Si hay pared delante → Girar derecha), Avanzar.": {"en": "Repeat until reaching the goal → (If underneath there are leaves → Sweep), (If there is a wall ahead → Turn right), Move forward."}, "una casa 🏠": {"en": "a house 🏠"}};

class Studio{
  constructor(app){

      almacen.setItem('done-robot',JSON.stringify([...this.done])); almacen.setItem('help-robot',JSON.stringify(this.help)); almacen.setItem('robot-v2','1'); } }catch(e){}

  }
  q(s){ return this.root.querySelector(s); }
  build(){
    this.root.innerHTML=`
      <div class="levels"></div>

        <div><p class="panel-t">${tr('Programa')}</p><div class="target-lbl"></div><div class="code"></div><div class="counter"></div></div>
        <div class="stage"><div class="stageBox"></div>

          <div class="msg"></div>
          <div class="brain"><h4>${tr('🧠 Dentro del ordenador')}</h4>
            <div class="lbl" style="margin-top:0">${tr('Instrucción que está ejecutando el procesador:')}</div><div class="pc">—</div>
            <div class="lbl">${tr('Memoria:')}</div><div class="regs"></div>

          </div>
        </div>
      </div>
      <div class="printbar"><label>${tr('👤 Nombre y apellidos:')}</label>
        <input class="pname" maxlength="60" placeholder="${tr('Escribe aquí tu nombre y apellidos')}">
        <button class="btn printBtn">${tr('🖨️ Imprimir (JPG)')}</button><span class="pmsg"></span></div>`;
    this.q('.pname').value=PNAME;
    this.q('.pname').oninput=e=>{ PNAME=e.target.value; e.target.classList.remove('need'); };
    this.q('.printBtn').onclick=()=>printSheet(this);
    this.q('.helpbar').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return;
      if(b.dataset.yes){ const n=+b.dataset.yes; if(this.helps()<n){ this.help[this.lvl]=n; try{ almacen.setItem('help-'+this.app.id,JSON.stringify(this.help)); }catch(e){} } this.renderHelp(); this.renderLevels(); if(n===3) this.loadSolution(); return; }
      if(b.dataset.load!==undefined){ this.loadSolution(); return; }
      if(b.dataset.no!==undefined){ this.renderHelp(); return; }
      const n=+b.dataset.h; if(n&&this.helps()===n-1) this.renderHelp(n); };
    this.code=this.q('.code');
    this.q('.levels').onclick=e=>{ const b=e.target.closest('button'); if(b) this.loadLevel(+b.dataset.l); };
    this.q('.runBtn').onclick=()=>this.onRun();
    this.q('.stepBtn').onclick=()=>this.onStep();
    this.q('.resetBtn').onclick=()=>{ this.stop(); this.reset(); this.msg(''); };
    this.pending=null;

    this.code.onclick=e=>{
      if(e.target.closest('select,.del')) return;

      if(blk&&slot&&slot.contains(blk)){ const f=this.find(+blk.dataset.id); if(f&&isBox(this.app.blocks[f.node.type])){ this.sel=blk.dataset.id; this.renderProgram(); } }
      else if(slot){ this.sel=slot.dataset.slot; this.renderProgram(); }
    };
  }
  get L(){ return this.app.levels[this.lvl]; }

  renderHelp(ask){
    const hb=this.q('.helpbar'), lv=this.L; if(!lv.h){ hb.style.display='none'; hb.innerHTML=''; return; } hb.style.display='';

      `<span class="hb-note">${tr(['Intenta resolverla sin ayuda. Si usas una ayuda, quedará anotado en la corrección.','Has usado 1 ayuda: quedará anotado en la corrección.','Has usado 2 ayudas: quedará anotado en la corrección.','Has usado 3 ayudas: quedará anotado en la corrección.'][u])}</span></div>`;

      `<button class="btn go" data-yes="${ask}">${tr('Sí, ver la ayuda')}</button><button class="btn alt" data-no>${tr('No, sigo probando')}</button></div>`;

    hb.innerHTML=h;

  loadSolution(){ if(!this.L.sol) return; this.program=this.clone(this.L.sol); this.sel='root'; this.changed(); }
  speed(){ return +this.q('.spd').value; }
  baseDelay(){ return DELAYS[this.speed()-1]; }
  label(n,info){ const d=this.app.blocks[n.type]; let s=tr(d.label);
    (d.params||[]).forEach(pr=>{ const o=pr.opts.find(o=>o[0]==n.p[pr.k]); s+=' '+(o?tr(o[1]):n.p[pr.k])+(pr.after?' '+tr(pr.after):''); });
    return s+(info?' '+info:''); }
  defaults(type){ const p={}; (this.app.blocks[type].params||[]).forEach(pr=>p[pr.k]=pr.def); return Object.assign(p,((this.L&&this.L.dflt)||{})[type]||{}); }
  newNode(type,p){ const d=this.app.blocks[type]; return {id:this.uid++,type,p:Object.assign(this.defaults(type),p||{}),children:isBox(d)?[]:undefined,other:d.kind==='ifelse'?[]:undefined}; }
  clone(spec){ return spec.map(s=>{ const n=this.newNode(s.type,s.p); if(s.children) n.children=this.clone(s.children); if(s.other) n.other=this.clone(s.other); return n; }); }
  count(nodes=this.program){ return nodes.reduce((a,n)=>a+1+(n.children?this.count(n.children):0)+(n.other?this.count(n.other):0),0); }
  find(id,nodes=this.program){ for(const n of nodes){ if(n.id===id) return {node:n,list:nodes}; for(const sub of [n.children,n.other]) if(sub){ const r=this.find(id,sub); if(r) return r; } } return null; }
  slotList(s){ s=String(s); if(s==='root') return this.program; const e=s.endsWith('e'); const f=this.find(parseInt(s)); return f?(e?f.node.other:f.node.children):this.program; }
  contains(node,id){ return node.id===id||[...(node.children||[]),...(node.other||[])].some(c=>this.contains(c,id)); }
  msg(t,cls){ const m=this.q('.msg'); m.className='msg'+(cls?' '+cls:''); m.innerHTML=t; }

  loadLevel(i){
    this.stop(); this.lvl=i; const lv=this.L;
    this.program=lv.pre?this.clone(lv.pre):[]; this.sel='root';
    this.q('.lvlPill').textContent=tr('Práctica {a} de {b}',{a:i+1,b:this.app.levels.length});
    this.q('.lvlTitle').innerHTML=tr(lv.t); this.q('.lvlDesc').innerHTML=tr(lv.d); this.q('.lvlConcept').innerHTML='💡 '+tr(lv.c); this.renderHelp();

    lv.p.forEach(t=>{ const def=this.app.blocks[t];
      const b=document.createElement('div'); b.className='blk '+def.cls; b.draggable=true;
      b.textContent=this.label({type:t,p:this.defaults(t)})+(def.kind==='ifelse'?tr(' … si no'):'');
      b.onclick=()=>this.add(t);
      b.ondragstart=e=>e.dataTransfer.setData('text/plain','new:'+t);

  renderLevels(){
    this.q('.levels').innerHTML=this.app.levels.map((l,i)=>`<button class="${i===this.lvl?'on':''} ${this.done.has(i)?'done u'+(l.h?this.helps(i):0):''}" data-l="${i}" title="${tr(l.t).replace(/<[^>]+>/g,'')}">${i+1}</button>`).join('');
