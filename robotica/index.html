<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prácticas de Computación y Robótica 1º ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --ink:#1B2140; --muted:#5B6280; --line:#E6DFD2;
  --navy:#1E2A5A; --accent:#FF6B4A; --yellow:#FFC93C; --green:#22A06B; --red:#E5484D;
  --move:#3B82F6; --turn:#8B5CF6; --loop:#F59E0B; --until:#EA580C; --if:#0EA5A4; --pen:#DB2777; --wait:#64748B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;cursor:pointer}
.logo small{display:block;font-weight:600;font-size:.78rem;opacity:.7}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.langs{display:flex;gap:7px;align-items:center}
.langs button{width:42px;height:28px;padding:0;border:3px solid transparent;border-radius:7px;overflow:hidden;background:none;opacity:.5;transition:opacity .15s,transform .15s}
.langs button:hover{opacity:.85;transform:scale(1.06)}
.langs button.on{opacity:1;border-color:var(--yellow)}
.langs svg{width:100%;height:100%;display:block}
nav button{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 16px;font-weight:800;font-size:.95rem}
nav button:hover{border-color:rgba(255,255,255,.6)}
nav button.on{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#fs{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:1rem}
main{max-width:1320px;margin:0 auto;padding:22px 22px 60px}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h1{font-size:2.3rem;line-height:1.1;margin:.3em 0 .2em;font-weight:900;letter-spacing:-.02em}
h2{font-size:1.7rem;margin:.1em 0 .25em;font-weight:900;letter-spacing:-.01em}
.pill{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:900;border-radius:999px;padding:3px 12px;font-size:.85rem}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:1rem;background:var(--navy);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.go{background:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* INICIO */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:22px}
@media(max-width:900px){.apps{grid-template-columns:1fr}}
.app-card{color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:24px;padding:24px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;font-size:1rem}
.app-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(30,42,90,.12);border-color:var(--navy)}
.app-card .ic{font-size:4rem;line-height:1}
.app-card h3{font-size:1.6rem;margin:10px 0 4px;font-weight:900}
.app-card p{margin:0 0 14px;color:var(--muted)}
.app-card .tags{display:flex;gap:6px;flex-wrap:wrap}
.app-card .tags span{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;background:#F4F1EA}
.app-card .prog{margin-top:14px;font-weight:900;color:var(--green)}

/* ESTUDIO */
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.levels button{min-width:46px;height:46px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:1.1rem;position:relative}
.levels button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.levels button.done::after{content:'✓';position:absolute;top:-8px;right:-8px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.lvlDesc{font-size:1.1rem}
.concept{background:#E9F6F1;border-left:5px solid var(--green);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.95rem;margin:8px 0 14px}
.studio{display:grid;grid-template-columns:210px minmax(260px,1fr) minmax(320px,460px);gap:16px;align-items:start}
@media(max-width:1100px){.studio{grid-template-columns:190px 1fr}.studio .stage{grid-column:1/-1}}
@media(max-width:640px){.studio{grid-template-columns:1fr}}
.panel-t{font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.palette{display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px}
.blk{border-radius:10px;color:#fff;font-weight:800;padding:9px 12px;user-select:none;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.palette .blk{cursor:grab}
.palette .blk:hover{filter:brightness(1.08)}
.c-move{background:var(--move)} .c-turn{background:var(--turn)} .c-loop{background:var(--loop)} .c-until{background:var(--until)} .c-if{background:var(--if)} .c-pen{background:var(--pen)} .c-wait{background:var(--wait)}
.code{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;min-height:340px}
.code.locked{pointer-events:none}
.slot{display:flex;flex-direction:column;gap:6px;min-height:44px;border-radius:10px;padding:6px;border:2px dashed transparent;transition:background .15s,border-color .15s}
.slot.root{min-height:300px}
.slot.selected{border-color:var(--accent);background:#FFF1EC}
.slot.over{background:#E8F0FF;border-color:var(--move)}
.slot .ph{color:#A3A8BD;font-weight:700;font-size:.9rem;padding:6px 4px}
.code .blk{cursor:grab}
.code .blk .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code .blk .del{margin-left:auto;background:rgba(0,0,0,.22);border:0;color:#fff;width:24px;height:24px;border-radius:7px;font-weight:900;line-height:1}
.code .blk .del:hover{background:rgba(0,0,0,.4)}
.code .blk select{font-family:inherit;font-weight:900;font-size:.95rem;border:0;border-radius:6px;padding:2px 4px;color:var(--ink)}
.code .blk .slot{background:rgba(255,255,255,.92);margin-top:8px;margin-left:12px}
.code .blk .slot.selected{background:#FFF1EC}
.code .blk.running{outline:4px solid var(--yellow);outline-offset:2px;filter:brightness(1.12)}
.target-lbl{font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.target-lbl b{color:var(--accent)}
.counter{font-weight:900;font-size:.95rem;margin-top:8px}
.counter.full{color:var(--red)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.speed{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--muted);margin-top:10px}
.msg{min-height:8px;margin-top:10px;font-weight:800;border-radius:12px}
.msg.bad{background:#FDECEC;color:#B4232A;padding:10px 14px}
.msg.info{background:#EEF3FF;color:var(--navy);padding:10px 14px}
.brain{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;margin-top:12px;font-size:.92rem}
.brain h4{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow)}
.brain .lbl{font-size:.78rem;opacity:.7;margin-top:8px}
.brain .regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin-top:4px}
.brain .regs div{background:rgba(255,255,255,.08);border-radius:8px;padding:6px;text-align:center}
.brain .regs small{display:block;opacity:.65;font-size:.72rem}
.brain .regs b{font-family:'JetBrains Mono',monospace;font-size:1.05rem}
.brain .pc{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;min-height:32px}

/* robot */
.board{position:relative;width:100%;aspect-ratio:1;background:#DCE4F5;border-radius:16px;padding:6px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:4px}
.cell{background:#F3F6FD;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,3.4vw,1.9rem)}
.cell.fog{background:#0F172A}
.c-act{background:#16A34A} .c-var{background:#475569} .c-fn{background:#BE185D}
.cell.tgt{outline:3px dashed #8B5CF6;outline-offset:-5px}
.cell.painted{background:#A78BFA}
.cell.painted.tgt{background:#8B5CF6;outline-color:#6D28D9}
.cell.soil{background:#E8D3B5} .cell.grass{background:#C8EBB5} .cell.tiles{background:#E2E8F0;background-image:linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px)}
.cell.fence{background:#FDE68A}
.cell.wet{box-shadow:inset 0 0 0 4px #60A5FA}
.robot .cargo{position:absolute;right:-6px;top:-8px;font-size:clamp(.7rem,1.6vw,1.1rem)}
.stageBox{position:relative}
.say-bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;border:4px solid var(--navy);border-radius:20px;padding:10px 22px;font-size:2rem;font-weight:900;z-index:5;pointer-events:none;transition:all .3s cubic-bezier(.3,1.5,.6,1)}
.say-bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.cell.wall{background:#334155;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.07) 6px 12px)}
.robot{position:absolute;width:calc((100% - 12px)/7);height:calc((100% - 12px)/7);transition:left .25s ease,top .25s ease,transform .25s ease;padding:4px;pointer-events:none;z-index:3}
.robot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:4px}}

/* lápiz */
.paper{width:100%;aspect-ratio:1;background:#fff;border-radius:16px;border:2px solid var(--line);display:block}
.paper .tgt{stroke:#C9D3EA;stroke-width:9;stroke-linecap:round;fill:none;stroke-dasharray:2 14}
.paper .ink{stroke-width:6;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.paper .turtle{transition:transform .3s ease}
.legend{display:flex;gap:14px;font-size:.85rem;font-weight:700;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:5px dotted #C9D3EA;vertical-align:middle;margin-right:4px}

/* semáforo */
.tl-wrap{background:#E8EDF7;border-radius:16px;padding:16px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.tl-wrap svg{width:130px;height:auto}
.lamp{transition:fill .15s, filter .15s}
.side{display:flex;flex-direction:column;gap:12px;align-items:center}
.clock{background:var(--navy);color:#fff;border-radius:12px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700}
.pbtn{width:120px;height:120px;border-radius:50%;border:6px solid #9CA3AF;background:#D1D5DB;font-weight:900;font-size:.95rem;color:#374151;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s}
.pbtn span{font-size:2rem}
.pbtn.waiting{background:var(--yellow);border-color:#F0A500;color:var(--navy);box-shadow:0 0 0 0 rgba(255,201,60,.8);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,201,60,.8)}100%{box-shadow:0 0 0 22px rgba(255,201,60,0)}}
.timeline{margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;overflow-x:auto}
.tl-row{display:flex;align-items:center;gap:4px;margin:6px 0;min-height:52px}
.tl-row>b{width:86px;flex:none;font-size:.82rem;color:var(--muted)}
.seg{height:48px;border-radius:8px;background:#F1F3F8;border:2px solid #E2E6F0;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:.72rem;font-weight:800;color:var(--muted)}
.seg .dots{display:flex;gap:3px}
.seg .dots i{width:12px;height:12px;border-radius:50%;display:block}
.seg.bad{border-color:var(--red);background:#FDECEC}

.overlay{position:fixed;inset:0;background:rgba(20,26,56,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:24px;padding:30px;max-width:520px;text-align:center;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal .big{font-size:4rem}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ===== ALGORITMOS ===== */
.al-def{background:var(--navy);color:#fff;border-radius:20px;padding:18px 22px;font-size:1.35rem;font-weight:800;line-height:1.7;margin:10px 0 16px}
.al-chip{display:inline-block;border-radius:10px;padding:0 12px;margin:0 2px;transition:all .4s}
.al-chip.off{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);letter-spacing:.1em}
.al-chip.on{background:var(--yellow);color:var(--navy);animation:pop .5s}
.al-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.al-tabs button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-weight:900;font-size:1rem;position:relative}
.al-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.al-tabs button.ok::after{content:'✓';position:absolute;top:-8px;right:-8px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.al-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px}
.al-h{font-size:1.5rem;font-weight:900;margin:0 0 4px}
.al-sub{color:var(--muted);margin:0 0 14px;font-size:1.05rem}
.al-tasks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.al-tasks button{border:2px solid var(--line);background:#F7F4EE;border-radius:12px;padding:8px 14px;font-weight:800;font-size:.95rem}
.al-tasks button.on{border-color:var(--accent);background:#FFF1EC}
.al-tasks button.ok{border-color:var(--green)}
.al-pool{display:flex;flex-wrap:wrap;gap:10px;min-height:96px;background:#F4F1EA;border-radius:16px;padding:12px}
.al-step{background:#fff;border:3px solid #D9DCE6;border-radius:14px;padding:10px 14px;font-weight:800;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:transform .12s,border-color .2s;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.al-step:hover{transform:translateY(-2px);border-color:var(--move)}
.al-step .em{font-size:1.9rem}
.al-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
@media(max-width:900px){.al-slots{grid-template-columns:1fr}}
.al-slot{border:3px dashed #C9CCD8;border-radius:14px;min-height:110px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;position:relative;background:#FCFBF8}
.al-slot .n{position:absolute;top:6px;left:10px;font-weight:900;color:var(--muted)}
.al-slot .em{font-size:2.2rem}
.al-slot.full{border-style:solid;border-color:#B8BDCC;background:#fff;cursor:pointer}
.al-slot.good{border-color:var(--green);background:#EAF7F0}
.al-slot.bad{border-color:var(--red);background:#FDECEC;animation:shake .4s}
.al-slot.play{transform:scale(1.07);box-shadow:0 0 0 5px var(--yellow);transition:transform .2s}
.al-arrow{display:none}
.al-fb{min-height:30px;font-weight:800;font-size:1.1rem;margin-top:12px}
.al-instr{display:flex;flex-direction:column;gap:10px}
.al-ins{border:3px solid #D9DCE6;border-radius:14px;padding:12px 14px;font-weight:700;font-size:1.05rem;cursor:pointer;background:#fff;display:flex;gap:10px;align-items:flex-start;transition:all .15s}
.al-ins:hover{border-color:var(--move)}
.al-ins .mk{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid #C9CCD8;display:flex;align-items:center;justify-content:center;font-size:1rem}
.al-ins.sel{border-color:var(--accent);background:#FFF1EC}
.al-ins.sel .mk{border-color:var(--accent);background:var(--accent);color:#fff}
.al-ins.good{border-color:var(--green);background:#EAF7F0}
.al-ins.bad{border-color:var(--red);background:#FDECEC}
.al-ins .why{display:block;font-weight:700;font-size:.92rem;color:#B4232A;margin-top:4px}
.al-robot{text-align:center}
.al-robot .face{font-size:6rem;line-height:1;transition:transform .3s}
.al-robot .bubble{background:#fff;border:3px solid var(--navy);border-radius:18px;padding:12px 16px;font-weight:800;font-size:1.05rem;margin-top:12px;position:relative}
.al-robot .bubble::before{content:'';position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--navy)}
.al-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:20px;align-items:start}
@media(max-width:900px){.al-two{grid-template-columns:1fr}}
.al-grid{display:grid;grid-template-columns:28px repeat(8,1fr);gap:3px;max-width:430px;user-select:none}
.al-grid .lb{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);font-size:.9rem}
.al-grid .px{aspect-ratio:1;background:#fff;border:2px solid #D9DCE6;border-radius:5px;cursor:pointer;transition:background .12s}
.al-grid .px:hover{border-color:var(--move)}
.al-grid .px.wrong{outline:3px solid var(--red);outline-offset:-3px}
.al-grid .px.miss{outline:3px dashed var(--red);outline-offset:-3px}
.al-list{counter-reset:k;display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.95rem}
.al-list div{background:#F4F1EA;border-radius:10px;padding:8px 12px;border-left:5px solid transparent;transition:all .2s}
.al-list div.cur{background:#FFF2C6;border-left-color:var(--yellow);transform:translateX(6px)}
.al-pics{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.al-pics button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.al-pics button.on{border-color:var(--accent);background:#FFF1EC}
.al-time{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.al-time div{background:var(--navy);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.al-time b{font-family:'JetBrains Mono',monospace;color:var(--yellow)}
/* CPU */
.cpu{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:stretch}
@media(max-width:1000px){.cpu{grid-template-columns:1fr}}
.cpu-box{border-radius:18px;padding:14px;color:#fff;position:relative}
.cpu-box h4{margin:0 0 10px;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.cpu-mem{background:#334155}
.cpu-cpu{background:var(--navy)}
.cpu-out{background:#0F766E}
.mem-row{display:grid;grid-template-columns:30px 92px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:4px;font-size:.88rem;transition:all .25s;position:relative;border:2px solid transparent}
.mem-row .ad{font-family:'JetBrains Mono',monospace;font-weight:700;background:rgba(255,255,255,.15);border-radius:6px;text-align:center}
.mem-row .bn{font-family:'JetBrains Mono',monospace;color:#93C5FD;font-size:.82rem}
.mem-row .tx{font-weight:800}
.mem-row.pc{background:rgba(255,201,60,.22);border-color:var(--yellow)}
.mem-row.pc::before{content:'▶';position:absolute;left:-14px;color:var(--yellow);font-size:.9rem}
.mem-row.bugged .tx{color:#FCA5A5}
.phases{display:flex;gap:6px;margin-bottom:12px}
.phases span{flex:1;text-align:center;border-radius:10px;padding:8px 4px;font-weight:900;font-size:.8rem;background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);transition:all .25s}
.phases span.on{background:var(--yellow);color:var(--navy);transform:scale(1.06)}
.cpu-unit{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-bottom:8px;transition:all .25s}
.cpu-unit small{display:block;opacity:.7;font-size:.75rem;font-weight:700}
.cpu-unit b{font-family:'JetBrains Mono',monospace;font-size:1.05rem}
.cpu-unit.flash{background:rgba(255,201,60,.35);box-shadow:0 0 0 3px var(--yellow)}
.cpu-regs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plate-wrap{position:relative;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.arm{position:absolute;top:0;font-size:3rem;transition:transform .35s ease;left:50%;margin-left:-24px}
.arm.down{transform:translateY(60px)}
.stack{display:flex;flex-direction:column-reverse;align-items:center;width:200px;margin-bottom:-6px;z-index:2}
.layer{width:170px;height:18px;margin-top:-4px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;animation:drop .45s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.l-bread{background:#E9B872;height:26px;border-radius:8px 8px 18px 18px;border:2px solid #B9853D}
.l-top{background:#E9B872;height:34px;border-radius:60px 60px 10px 10px;border:2px solid #B9853D}
.l-ham{background:#F4A6B4;border:2px solid #D97789;border-radius:12px;width:180px}
.l-tomato{background:#E5484D;border:2px solid #B4232A;width:160px;height:14px}
.l-cheese{background:#FFD43B;border:2px solid #E0A100;width:184px;border-radius:3px}
.l-lettuce{background:#7BC96F;border:2px solid #4E9E43;width:186px;border-radius:14px}
.plate{width:240px;height:28px;background:#fff;border-radius:50%;box-shadow:0 6px 0 #CBD5E1}
.out-msg{text-align:center;font-weight:800;margin-top:12px;min-height:26px}
.al-token{position:absolute;z-index:30;background:var(--yellow);color:var(--navy);font-family:'JetBrains Mono',monospace;font-weight:700;border-radius:10px;padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.3);pointer-events:none;transition:left .6s ease,top .6s ease,opacity .2s;opacity:0;white-space:nowrap}
.narr{background:#FFF2C6;border:3px solid var(--yellow);border-radius:16px;padding:14px 18px;font-weight:800;font-size:1.1rem;margin-top:14px;min-height:60px}
.cpu-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.cpu-edit{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:.88rem;font-weight:700}
.cpu-edit select{font-family:inherit;font-weight:800;border-radius:6px;border:0;padding:2px 4px}
.cpu-edit button{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:6px 10px;font-weight:800}
.fact{color:var(--muted);font-weight:700;font-size:.92rem}
.app-card .badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:900;margin-left:6px;vertical-align:middle}

.printbar{margin-top:22px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.printbar label{font-weight:900}
.printbar input{flex:1;min-width:240px;font-family:inherit;font-size:1.05rem;font-weight:700;padding:10px 14px;border:3px solid var(--line);border-radius:12px}
.printbar input:focus{outline:none;border-color:var(--move)}
.printbar input.need{border-color:var(--red);animation:shake .4s}
.printbar .pmsg{font-weight:800;color:var(--muted)}
#printOv .modal{max-width:920px;width:100%;padding:20px}
#printOv img{max-width:100%;max-height:65vh;border-radius:12px;border:2px solid var(--line);display:block;margin:0 auto}
</style>
